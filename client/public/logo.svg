<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 1. Outer Surya Sun Chakra Gold Gradient (Exact Navbar Hex) -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4A3" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- 2. Central Royal Vedic Blue Medallion Radial Gradient (Exact Navbar Hex) -->
    <radialGradient id="innerCrestGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="65%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B132B" />
    </radialGradient>

    <!-- 3. Inner Gold Rim Gradient (Exact Navbar Hex) -->
    <linearGradient id="innerGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- 4. Luminous Divine Om Glow Filter -->
    <filter id="omGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#FEF08A" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Outer Surya Sun Chakra Rays & Mandala (Exact Navbar, Transparent Background) -->
  <g transform="translate(60,60)">
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(0)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(15)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(30)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(45)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(60)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(75)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(90)" />
