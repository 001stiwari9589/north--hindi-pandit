    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(150)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(165)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(180)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(195)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(210)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(225)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(240)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(255)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(270)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(285)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(300)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(315)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(330)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(345)" />
  </g>

  <!-- 2. Inner Sacred Om Crest (Exact Navbar Scale & Elements) -->
  <g transform="translate(60,60) scale(0.816)">
    <!-- Central Royal Vedic Blue Disc -->
    <circle cx="0" cy="0" r="46" fill="url(#innerCrestGrad)" />
    <!-- Rich Gold Rim -->
