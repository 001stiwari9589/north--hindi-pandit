    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(345)" />
    <!-- Outer Circular Ring connecting rays -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#sunGoldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="39.8" fill="none" stroke="#FFF4A3" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.9" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(0)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(15)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(30)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(45)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(60)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(75)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(90)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(105)" />
    <circle cx="0" cy="-38" r="1.2" fill="#FFF4A3" transform="rotate(120)" />
