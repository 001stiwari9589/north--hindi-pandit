    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(120)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(135)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(150)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(165)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(180)" />
    <path d="M -2.2 -38 L 0 -49 L 2.2 -38 Z" fill="url(#sunGoldGrad)" opacity="0.88" transform="rotate(195)" />
    <path d="M -3.5 -38 Q -1 -48 0 -58 Q 1 -48 3.5 -38 Z" fill="url(#sunGoldGrad)" transform="rotate(210)" />
