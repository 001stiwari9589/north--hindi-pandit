    <circle cx="0" cy="0" r="39" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.85" />
    <!-- 12 Inner Sacred Lotus Petals -->
    <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(0)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(30)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(60)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(90)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(120)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(150)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(180)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(210)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(240)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(270)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(300)" />
      <ellipse cx="0" cy="-33" rx="2.4" ry="4.2" fill="#FDE68A" opacity="0.85" transform="rotate(330)" />
    <!-- Central Sacred Divine OM (ॐ) - Luminous, Upright & Beautiful -->
    <text text-anchor="middle" dominant-baseline="central" y="1.5" font-family="'Cormorant Garamond', 'Nirmala UI', 'Tiro Devanagari Hindi', 'Arial Unicode MS', serif" font-size="38" font-weight="900" fill="#FEF08A" filter="url(#omGlow)">ॐ</text>
  </g>
</svg>