<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Royal Spiritual Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7B1113" />
      <stop offset="65%" stop-color="#4A0507" />
      <stop offset="100%" stop-color="#240203" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="35%" stop-color="#F5B700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <linearGradient id="brightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Outer Decorative Ring with Dots (Vedic Border) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4, 10" />

  <!-- Sudarshan Chakra Spokes / Petals (16 radiant points) -->
  <g transform="translate(256, 256)" stroke="url(#goldGrad)" stroke-width="5" fill="url(#goldGrad)" opacity="0.95">
    <!-- 16 Radial Diamond Petals -->
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(22.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(45)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(67.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(90)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(112.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(135)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(157.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(180)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(202.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(225)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(247.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(270)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(292.5)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(315)" />
    <path d="M 0,-218 L 12,-180 L 0,-168 L -12,-180 Z" transform="rotate(337.5)" />

    <!-- 16 Chakra Spokes (Lines to Center Ring) -->
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(22.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(45)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(67.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(90)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(112.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(135)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(157.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(180)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(202.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(225)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(247.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(270)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(292.5)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(315)" />
    <line x1="0" y1="-170" x2="0" y2="-130" stroke-width="4" transform="rotate(337.5)" />
  </g>

  <!-- Inner Concentric Golden Rings -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="124" fill="#3D0305" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Sacred OM (ॐ) in the center with divine glow -->
  <text x="256" y="296" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        font-family="'Tiro Devanagari Hindi', 'Sanskrit Text', 'Nirmala UI', 'Mangal', 'Georgia', serif" 
        font-size="180" 
        font-weight="900" 
        fill="url(#brightGold)"
        filter="url(#glow)">ॐ</text>
</svg>